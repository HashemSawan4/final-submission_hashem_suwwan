<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#">
            Expense Tracker
        </a>

        <button id="darkModeBtn" class="btn btn-outline-light">
            🌙 Dark Mode
        </button>

    </div>
</nav>

<div class="container mt-3">

    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
    </div>

</div>





<div class="container mt-4">

    <div class="summary-grid">

        <!-- Total -->
        <div class="card text-center">
            <div class="card-body">
                <h6>Total</h6>
                <h3 id="totalAmount">0.00</h3>
            </div>
        </div>

        <!-- Number of expenses -->
        <div class="card text-center">
            <div class="card-body">
                <h6>Number of expenses</h6>
                <h3 id="expenseCount">0</h3>
            </div>
        </div>

        <!-- Highest expense -->
        <div class="card text-center">
            <div class="card-body">
                <h6>Highest expense</h6>
                <h3 id="highestAmount">0.00</h3>
                <p id="highestTitle">-</p>
            </div>
        </div>

    </div>

</div>

    </div>
    <!-- form titl amount date category -->
    <div class="container mt-4">

    <div class="card">
        <div class="card-body">

            <h4 class="mb-4">Add expense</h4>

            <form id="expenseForm">
   <!-- we used get to  organize form -->
                <div class="row">

                    <!-- Title -->
                    <div class="col-md-3 mb-3">
                        <label for="title" class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            class="form-control"
                        >

                        <div id="titleError" class="text-danger"></div>
                    </div>

                    <!-- Amount -->
                    <div class="col-md-3 mb-3">
                        <label for="amount" class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            step="0.01"
                        >

                        <div id="amountError" class="text-danger"></div>
                    </div>

                    <!-- Category -->
                    <div class="col-md-3 mb-3">
                        <label for="category" class="form-label">
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                        >
                            <option value="">Choose...</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>

                        <div id="categoryError" class="text-danger"></div>
                    </div>

                    <!-- Date -->
                    <div class="col-md-3 mb-3">
                        <label for="date" class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            class="form-control"
                        >

                        <div id="dateError" class="text-danger"></div>
                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add expense
                </button>

            </form>

        </div>
    </div>

</div>



<!--Spinner  -->
<div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <p class="mt-2">Loading...</p>
</div>





<!-- Expenses Table -->
<div class="card mt-4">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3 class="mb-0">Expenses</h3>

            <!-- Category Filter -->
            <div>
                <label for="categoryFilter" class="form-label">
                    Category
                </label>

                <select id="categoryFilter" class="form-select">
                    <option value="">All</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

        </div>


        <!-- Table -->
        <div class="table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="expensesTableBody">
                    <!-- JavaScript will add expenses here -->
                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Edit Expense Modal -->
<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">

        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Expense
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <!-- Modal Body -->
            <div class="modal-body">

                <form id="editExpenseForm">

                    <!-- Title -->
                    <div class="mb-3">

                        <label for="editTitle" class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            id="editTitle"
                            class="form-control">

                    </div>


                    <!-- Amount -->
                    <div class="mb-3">

                        <label for="editAmount" class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="editAmount"
                            class="form-control"
                            step="0.01">

                    </div>


                    <!-- Category -->
                    <div class="mb-3">

                        <label for="editCategory" class="form-label">
                            Category
                        </label>

                        <select
                            id="editCategory"
                            class="form-select">

                            <option value="">Choose...</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>


                    <!-- Date -->
                    <div class="mb-3">

                        <label for="editDate" class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            id="editDate"
                            class="form-control">

                    </div>

                </form>

            </div>


            <!-- Modal Footer -->
            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    type="submit"
                    form="editExpenseForm"
                    class="btn btn-primary">
                    Save Changes
                </button>

            </div>

        </div>

    </div>

</div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
