<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CORS Test</title>
</head>

<body>

    <h1>CORS Test</h1>

    <button id="loadBtn">
        Load Expenses
    </button>

    <script>

        document.getElementById("loadBtn").addEventListener("click", async () => {

            const response = await fetch(
                "http://localhost:3000/api/expenses"
            );

            const data = await response.json();

            console.log(data);

        });

    </script>

</body>

</html>
